# TEMPORAIRE — vérification de l'accès Search Console, à supprimer.
name: Vérification GSC (temporaire)

on:
  push:
    branches: [claude/optimistic-euler-cijbqf]

permissions:
  contents: read

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-gsc.txt
      - name: sites.list
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: python scripts/collecte_gsc.py --sites
      - name: Collecte complète (sans commit), deux passes
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          python scripts/collecte_gsc.py
          wc -l data/gsc/*.csv
          head -4 data/gsc/gsc-date.csv data/gsc/gsc-date-device.csv
          cp -r data/gsc /tmp/gsc1
          python scripts/collecte_gsc.py
          wc -l data/gsc/*.csv
          diff -r /tmp/gsc1 data/gsc && echo "Deuxième passe identique : pas de doublon"
