name: Collecte quotidienne

on:
  schedule:
    # 10h30 heure de Paris (8h30 UTC en été, 9h30 UTC en hiver)
    # On cible 9h00 UTC, soit ~11h CEST / ~10h CET
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecte Wikipedia
        run: python scripts/collecte_wikipedia.py

      - name: Collecte Polymarket
        run: python scripts/collecte_polymarket.py

      - name: Validation
        run: python scripts/validation.py

      - name: Calcul des séries
        run: python scripts/series.py

      - name: Vérifier les changements
        id: changes
        run: |
          if git diff --quiet data/sondages.json data/polymarket.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ouvrir une pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="collecte/${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add data/sondages.json data/polymarket.json data/snapshots/
          git commit -m "Collecte du ${DATE}"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Collecte du ${DATE}" \
            --body "$(cat <<'EOF'
          ## Collecte automatique

          - Wikipedia : sondages mis à jour
          - Polymarket : cotes mises à jour
          - Validation : OK
          - Séries T1 recalculées

          La page de revue est téléchargeable dans les artifacts du workflow.
          EOF
          )" \
            --base main \
            --head "$BRANCH"

      - name: Joindre la page de revue
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: revue
          path: data/derived/revue.html
