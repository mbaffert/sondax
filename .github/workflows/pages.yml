name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # commit de data/lastmod.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer les données dérivées
        run: |
          python scripts/principale.py
          python scripts/series.py
          python scripts/series_historique.py
          python scripts/build_header.py
          python scripts/pages_second_tour.py
          python scripts/build_index_second_tour.py
          python scripts/build_index_premier_tour.py
          python scripts/build_sondages_page.py
          python scripts/build_elections_chapeaux.py
          python scripts/build_pages_candidats.py
          python scripts/build_candidats_index.py
          python scripts/build_sondage_pages.py
          python scripts/instituts.py
          python scripts/build_pages_instituts.py
          python scripts/calibration.py
          python scripts/backtest.py
          python scripts/modele.py
          python scripts/partage_modele.py
          python scripts/build_modele.py
          python scripts/build_methode_modele.py
          python scripts/build_donnees.py
          python scripts/build_jsonld_dataset.py
          python scripts/build_dates.py
          python scripts/build_sitemap.py
          python scripts/validate_urls.py

      - name: Préparer l'artefact
        run: |
          mkdir -p _site/data/derived
          cp -r site/* _site/
          cp -r data/*.json _site/data/
          cp -r data/derived/*.json _site/data/derived/
          rm -f _site/data/historique.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deploy

      # data/lastmod.json porte les dates de dernière modification du sitemap.
      # Sans ce commit, chaque build repartirait de la version du dépôt et
      # redaterait au jour du build les pages déjà modifiées depuis.
      # Un push fait avec GITHUB_TOKEN ne relance pas ce workflow.
      - name: Enregistrer data/lastmod.json
        run: |
          git diff --quiet data/lastmod.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lastmod.json
          git commit -m "lastmod : dates de modification des pages"
          # Si main a avancé, un nouveau déploiement est en route et recalculera
          # le fichier : on n'échoue pas.
          git push origin HEAD:main || echo "::warning::main a avancé, lastmod.json non enregistré"
