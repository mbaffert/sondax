name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Chaque jour : le bloc Rétro-Sondax statique (build_retro.py) passe au J-x du jour.
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Historique complet : build_sitemap.py date les pages rédigées à la main
      # par le dernier commit de leur fichier (git log).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer les données dérivées
        run: |
          python scripts/principale.py
          python scripts/series.py
          python scripts/series_historique.py
          python scripts/build_header.py
          python scripts/pages_second_tour.py
          python scripts/build_index_second_tour.py
          python scripts/build_index_premier_tour.py
          python scripts/partage_premier_tour.py
          python scripts/partage_polymarket.py
          python scripts/build_retro.py
          python scripts/build_sondages_page.py
          python scripts/build_pages_elections.py
          python scripts/build_pages_candidats.py
          python scripts/build_candidats_index.py
          python scripts/build_sondage_pages.py
          python scripts/instituts.py
          python scripts/build_pages_instituts.py
          python scripts/calibration.py
          python scripts/backtest.py
          python scripts/modele.py
          python scripts/partage_modele.py
          python scripts/build_modele.py
          python scripts/build_methode_modele.py
          python scripts/build_donnees.py
          python scripts/build_gsc_public.py
          python scripts/build_jsonld_dataset.py
          python scripts/build_jsonld_navigation.py
          python scripts/build_dates.py
          # Bloc « Questions fréquentes » : après le modèle (build_modele) et les dates
          python scripts/build_faq.py
          # Bandeau statique dans toutes les pages, une fois celles-ci générées
          python scripts/build_header.py --injecter
          # Petites feuilles CSS intégrées en <style> dans chaque page (après toute écriture de page)
          python scripts/inline_css.py
          python scripts/build_sitemap.py
          # llms.txt et .well-known/ard.json ; avant validate_urls.py, qui vérifie <link rel="ard">
          python scripts/build_llms.py
          python scripts/build_faq.py --verifier
          python scripts/validate_urls.py

      - name: Préparer l'artefact
        run: |
          mkdir -p _site/data/derived
          cp -r site/* _site/
          # « cp -r site/* » ignore les dossiers cachés : .well-known (ard.json) est copié à part.
          # upload-pages-artifact@v3 archive tout _site/ (tar de « . », sans .git ni .github) :
          # .well-known part donc bien avec l'artefact.
          cp -r site/.well-known _site/.well-known
          cp -r data/*.json _site/data/
          cp -r data/derived/*.json _site/data/derived/
          rm -f _site/data/historique.json
          rm -f _site/data/historique_europeennes.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deploy

      # Après la mise en ligne : on ne notifie que des pages réellement publiées.
      # Seulement sur push (merge d'une collecte), pas sur le cron quotidien ;
      # un échec IndexNow ne doit jamais faire échouer le déploiement.
      - name: Notifier IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: python scripts/indexnow.py _site/sitemap.xml
