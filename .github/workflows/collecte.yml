name: Collecte quotidienne

on:
  schedule:
    # 7h17 CET (heure d'hiver fixe, UTC+1)
    - cron: '17 6 * * *'
    # 14h17 CET
    - cron: '17 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecte Wikipedia
        run: python scripts/collecte_wikipedia.py

      - name: Collecte Polymarket
        run: python scripts/collecte_polymarket.py

      - name: Validation
        id: validation
        run: python scripts/validation.py

      - name: Calcul des séries
        run: python scripts/series.py

      - name: Vérifier les changements
        id: changes
        run: |
          if git diff --quiet data/sondages.json data/polymarket.json data/sondages_manuels.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ouvrir ou mettre à jour la pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="collecte/${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Réutiliser la branche si elle existe déjà (run précédent du jour)
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git merge origin/main --no-edit
          else
            git checkout -b "$BRANCH"
          fi

          git add data/sondages.json data/polymarket.json data/snapshots/
          git diff --cached --quiet && echo "Rien de nouveau à commiter" && exit 0
          git commit -m "Collecte du ${DATE}"
          git push -u origin "$BRANCH"

          # Créer la PR seulement si elle n'existe pas déjà
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING_PR" ]; then
            # Mettre à jour le corps de la PR existante
            if [ -f data/derived/revue.md ]; then
              gh pr edit "$EXISTING_PR" --body-file data/derived/revue.md
            fi
            PR_URL="$EXISTING_PR"
          else
            if [ -f data/derived/revue.md ]; then
              PR_URL=$(gh pr create \
                --title "Collecte du ${DATE}" \
                --body-file data/derived/revue.md \
                --base main \
                --head "$BRANCH")
            else
              PR_URL=$(gh pr create \
                --title "Collecte du ${DATE}" \
                --body "Collecte automatique du ${DATE}. Aucun sondage ajouté ou modifié (mise à jour Polymarket uniquement)." \
                --base main \
                --head "$BRANCH")
            fi
          fi

          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Préparer le corps du mail
        id: mail
        if: always()
        run: |
          ADDED="${{ steps.validation.outputs.added }}"
          MODIFIED="${{ steps.validation.outputs.modified }}"
          PR_URL="${{ steps.pr.outputs.url }}"
          STATUS="${{ job.status }}"

          {
            if [ "$STATUS" = "failure" ]; then
              echo "⚠ Le run de collecte a échoué."
              echo ""
            fi

            if [ -f data/derived/mail_body.txt ]; then
              cat data/derived/mail_body.txt
            else
              echo "Aucune donnée de collecte disponible (le run a échoué avant la validation)."
            fi

            echo ""
            if [ -n "$PR_URL" ]; then
              echo "PR : ${PR_URL}"
            fi
            echo ""
            echo "Ajoutés : ${ADDED:-0} · Modifiés : ${MODIFIED:-0}"
          } > /tmp/mail_body.txt

          # Pass body via GITHUB_OUTPUT (multiline)
          {
            echo "body<<MAILEOF"
            cat /tmp/mail_body.txt
            echo "MAILEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notification par mail
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: maxime.baffert@gmail.com
          from: Sondax <${{ secrets.MAIL_USERNAME }}>
          subject: >-
            Sondax — ${{ steps.validation.outputs.added || '0' }} nouveau(x)${{ job.status == 'failure' && ' — ÉCHEC' || '' }}
          body: ${{ steps.mail.outputs.body }}
